[tox]
envlist =
    # Celery 5.2: py312 excluded
    {py39,py310,py311}-celery52-tornado65,
    # Celery 5.3–5.5: py39–py312
    {py39,py310,py311,py312}-{celery53,celery54,celery55}-tornado65,
    lint
skip_missing_interpreters = true

[testenv]
deps =
    -r requirements/dev.txt
    mock
    celery52: celery==5.2.*
    celery53: celery==5.3.*
    celery54: celery==5.4.*
    celery55: celery==5.5.*
    tornado65: tornado>=6.5.7,<6.6
commands =
    python -m flower --version
    python -m tests.unit

[testenv:lint]
deps = pylint
commands = pylint flower --rcfile .pylintrc
