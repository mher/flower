[tox]
envlist =
    # Celery 5.2: py310–py311
    {py310,py311}-celery52-tornado65,
    # Celery 5.3–5.4: py310–py312
    {py310,py311,py312}-{celery53,celery54}-tornado65,
    # Celery 5.5: py310–py313
    {py310,py311,py312,py313}-celery55-tornado65,
    # Celery 5.6: py310–py314
    {py310,py311,py312,py313,py314}-celery56-tornado65,
    lint
skip_missing_interpreters = true

[testenv]
deps =
    -r requirements/dev.txt
    celery52: celery==5.2.*
    celery53: celery==5.3.*
    celery54: celery==5.4.*
    celery55: celery==5.5.*
    celery56: celery==5.6.*
    tornado65: tornado>=6.5.7,<6.6
commands =
    python -m flower --version
    python -m tests.unit

[testenv:lint]
deps = pylint
commands = pylint flower --rcfile .pylintrc
