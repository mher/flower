name: Build

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13', '3.14']
        celery-version: ['5.2.*', '5.3.*', '5.4.*', '5.5.*', '5.6.*']
        tornado-version: ['6.5.7']
        exclude:
          - python-version: '3.12'
            celery-version: '5.2.*'
          - python-version: '3.13'
            celery-version: '5.2.*'
          - python-version: '3.13'
            celery-version: '5.3.*'
          - python-version: '3.13'
            celery-version: '5.4.*'
          - python-version: '3.14'
            celery-version: '5.2.*'
          - python-version: '3.14'
            celery-version: '5.3.*'
          - python-version: '3.14'
            celery-version: '5.4.*'
          - python-version: '3.14'
            celery-version: '5.5.*'

    steps:
    - uses: actions/checkout@v7

    - name: Set up python
      uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install celery==${{ matrix.celery-version }} \
                    tornado==${{ matrix.tornado-version }} \
                    -r requirements/dev.txt


    - name: Run unit tests
      run: |
        python -m flower --version
        python -m tests.unit

    - name: Lint with pylint
      run: |
        pylint flower --rcfile .pylintrc
